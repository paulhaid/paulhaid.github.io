<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaulHaid Social Media</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: #000000;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-y: auto;
        position: relative;
      }

      video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
      }

      .container {
        width: 100%;
        margin-top: inherit;
        max-width: 500px;
        text-align: center;
        background-color: rgba(255, 255, 255, 0.160);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        overflow: hidden;
        position: relative;
        z-index: 2;
      }

      .profile-section {
        padding: 18px 20px 20px;
      }

      .profile-img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid rgb(255, 255, 255, 0.5);
        margin-bottom: 16px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      .name {
        font-size: 24px;
        font-weight: 700;
        color: rgb(255, 255, 255);
        text-shadow: 0 0px 5px rgba(0, 0, 0, 1.0);
      }

      .links-section {
        padding: 20px;
      }

      .link-item {
        display: block;
        width: 100%;
        padding: 12px 20px;
        margin-bottom: 15px;
        background-color: rgba(120, 0, 200, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        color: rgb(255, 255, 255);
        text-shadow: 0 0px 5px rgba(0, 0, 0, 1.0);
        text-decoration: none;
        transition: all 0.3s ease;
        cursor: pointer;
        backdrop-filter: blur(5px);
      }

      .link-item:hover {
        background-color: rgba(0, 241, 0, 0.2);
        transform: translateY(-2px);
        color: rgb(255, 255, 255);
        text-shadow: 0 0px 10px rgba(0, 0, 0, 0.8);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      }

      .link-item:last-child {
        margin-bottom: 0;
      }
    </style>
